name: Daily Regulatory Briefing

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 6 AM CT (11 AM UTC), Monday-Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests
      
      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAGI_API_KEY: ${{ secrets.KAGI_API_KEY }}
        run: |
          python scripts/generate_briefing.py 2>&1 | tee /tmp/briefing.log
          
      - name: Log generated briefing files
        if: always()
        run: |
          echo "===== Briefing generation log (last 50 lines) ====="
          if [ -f /tmp/briefing.log ]; then
            tail -n 50 /tmp/briefing.log
          else
            echo "No briefing log found."
          fi

          echo ""
          echo "===== Generated briefing files ====="
          if [ -d briefings ]; then
            FILECOUNT=$(find briefings -maxdepth 1 -type f -name '*.md' | wc -l)
            echo "Total files: $FILECOUNT"
            find briefings -maxdepth 1 -type f -name '*.md' -printf '%f\n' | sort
          else
            echo "No briefings directory found."
          fi

          echo ""
          echo "===== Git status ====="
          git status --short

          echo ""
          echo "===== Workflow summary ====="
          if [ -d briefings ] && [ $(find briefings -maxdepth 1 -type f -name '*.md' | wc -l) -gt 0 ]; then
            echo "✓ Briefing generation successful"
          else
            echo "✗ No briefing files generated"
          fi
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Briefing Bot"
          git add -A
          git commit -m "Daily briefing: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
